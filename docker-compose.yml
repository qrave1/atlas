services:
    atlas:
        image: ghcr.io/qrave1/atlas:latest
        container_name: atlas
        restart: always
        env_file:
            - .env
        environment:
            DATABASE_PATH: /app/data/atlas.db
            GOOGLE_CREDENTIALS_FILE: /app/secrets/google-credentials.json
            GOOGLE_TOKEN_FILE: /app/google/google-token.json
        volumes:
            - atlas-data:/app/data
            - ./secrets:/app/secrets:ro
            - ./google:/app/google
        labels:
            - "com.centurylinklabs.watchtower.enable=false"

volumes:
    atlas-data:
