services:
    atlas:
        image: ghcr.io/qrave1/atlas:latest
        container_name: atlas
        restart: always
        env_file:
            - .env
        environment:
            DATABASE_PATH: /app/data/atlas.db
            GOOGLE_CREDENTIALS_FILE: ./secrets/google-credentials.json
            GOOGLE_TOKEN_FILE: ./secrets/google-token.json
        volumes:
            - atlas-data:/app/data
            - type: bind
              source: ./secrets
              target: /app/secrets
              bind:
                  create_host_path: false
        labels:
            - "com.centurylinklabs.watchtower.enable=true"

volumes:
    atlas-data:
